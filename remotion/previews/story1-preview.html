<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Story 1 — Speak ESG Preview v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9,700&family=Inter:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 14px 32px;
      -webkit-font-smoothing: antialiased;
    }

    .meta {
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 4px 10px;
      font-family: -apple-system, sans-serif;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: #444;
    }
    .meta b { color: #2742DD; }

    #scaler { width: 100%; position: relative; }

    #frame {
      width: 1080px;
      height: 1920px;
      position: relative;
      background: #F0E9DB;
      transform-origin: top left;
      overflow: hidden;
    }

    .f-serif { font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'opsz' 9; }
    .f-sans  { font-family: 'Inter', -apple-system, sans-serif; }
    .f-mono  { font-family: 'Space Mono', 'Courier New', monospace; }
  </style>
</head>
<body>

  <div class="meta">
    <b>STORY 1 · SPEAK ESG</b>
    <span>1080 × 1920 · preview v2</span>
    <span>MUNDIAL 2026</span>
  </div>

  <div id="scaler">
    <div id="frame">

      <!-- ══════════════════════════════════
           HEADER — top: 250px (SAFE.top)
      ══════════════════════════════════ -->
      <div style="
        position: absolute;
        top: 250px;
        left: 80px;
        right: 80px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      ">
        <!--
          Logo Speak ESG Podcast — archivo original.
          mix-blend-mode: multiply: workaround para fondo blanco/gris del PNG.
          Para render final: PNG con canal alpha (fondo transparente).
        -->
        <img
          src="../src/assets/logo-speak-esg.png"
          style="height: 90px; width: auto; display: block; mix-blend-mode: multiply;"
          alt="Speak ESG Podcast"
        />

        <span class="f-mono" style="
          font-size: 22px;
          letter-spacing: 0.22em;
          color: #7C786E;
          font-weight: 400;
        ">MUNDIAL 2026</span>
      </div>


      <!-- ══════════════════════════════════
           TEXTO EDITORIAL — top: 340px
      ══════════════════════════════════ -->
      <div style="position: absolute; top: 340px; left: 80px; right: 80px;">

        <!-- Eyebrow -->
        <div class="f-mono" style="
          font-size: 24px;
          letter-spacing: 0.22em;
          color: #2742DD;
          margin-bottom: 32px;
        ">DÍA DE PARTIDO</div>

        <!-- Titular L1 -->
        <div class="f-serif" style="
          font-size: 152px;
          font-weight: 700;
          color: #1A1813;
          line-height: 0.9;
          letter-spacing: -0.03em;
        ">Hoy hay</div>

        <!-- Titular L2 + punto azul -->
        <div class="f-serif" style="
          font-size: 152px;
          font-weight: 700;
          color: #1A1813;
          line-height: 0.95;
          letter-spacing: -0.03em;
          display: flex;
          align-items: baseline;
        ">
          <span>fútbol</span><span style="color: #2742DD;">.</span>
        </div>

        <!-- Subtítulo -->
        <div class="f-sans" style="
          margin-top: 52px;
          font-size: 38px;
          color: #3A372F;
          line-height: 1.45;
          font-weight: 400;
        ">
          Pero también hay&nbsp;<strong style="font-weight: 700;">algo más en juego.</strong>
        </div>

      </div>


      <!-- ══════════════════════════════════
           TICKET — Apple Wallet / pase digital
           NUEVO: subido (bottom: 400px) · más alto · sombra refinada
           Cambios vs v1:
             · bottom: 340 → 400px (+60px arriba)
             · padding: 34/40/38 → 44/48/48px (más aire interno)
             · stripe: 8 → 10px
             · notches: r=18 → r=20 (38px → 40px diam)
             · sombra: dos capas ambient + contact
             · 90:00: font-size 64 → 72px, letter-spacing ajustado
             · divider: opacidad más sutil (0.18 → 0.13)
      ══════════════════════════════════ -->
      <div style="
        position: absolute;
        bottom: 400px;
        left: 80px;
        right: 80px;
      ">
        <div style="
          position: relative;
          border-radius: 32px;
          background-color: #F7F2E8;
          box-shadow:
            0 32px 72px rgba(26,24,19,0.12),
            0 8px 20px rgba(26,24,19,0.06),
            inset 0 2px 0 rgba(255,255,255,0.72);
          border: 1.5px solid rgba(26,24,19,0.06);
          overflow: hidden;
        ">

          <!-- Stripe azul — 10px -->
          <div style="height: 10px; background-color: #2742DD; width: 100%;"></div>

          <!-- Contenido -->
          <div style="padding: 44px 48px 48px;">

            <!-- Fila mono -->
            <div class="f-mono" style="
              display: flex;
              justify-content: space-between;
              font-size: 19px;
              letter-spacing: 0.12em;
              color: #7C786E;
            ">
              <span>MATCHDAY · MEX 2026</span>
              <span>ACCESO GENERAL</span>
            </div>

            <!-- Divisor perforado — más sutil -->
            <div style="
              margin-top: 24px;
              margin-bottom: 28px;
              border-top: 2px dashed rgba(26,24,19,0.13);
            "></div>

            <!-- Fila principal -->
            <div style="
              display: flex;
              align-items: flex-end;
              justify-content: space-between;
              gap: 16px;
            ">

              <!-- Columna izquierda: sede + estado -->
              <div>
                <div class="f-serif" style="
                  font-size: 58px;
                  font-weight: 700;
                  color: #1A1813;
                  line-height: 1.0;
                  letter-spacing: -0.01em;
                ">MEX · Sede 01</div>

                <div class="f-mono" style="
                  margin-top: 18px;
                  display: flex;
                  align-items: center;
                  gap: 10px;
                  font-size: 20px;
                  letter-spacing: 0.1em;
                  color: #2742DD;
                ">
                  <!-- Dot EN JUEGO con glow -->
                  <span style="
                    display: inline-block;
                    width: 12px;
                    height: 12px;
                    border-radius: 50%;
                    background-color: #2742DD;
                    box-shadow: 0 0 12px rgba(39,66,221,0.55);
                    flex-shrink: 0;
                  "></span>
                  EN JUEGO
                </div>
              </div>

              <!-- Columna derecha: tiempo — 72px, alineado al bottom -->
              <div class="f-mono" style="
                font-size: 72px;
                font-weight: 700;
                color: #2742DD;
                letter-spacing: 0.01em;
                line-height: 1;
                flex-shrink: 0;
              ">90:00</div>

            </div>
          </div><!-- fin padding -->

          <!-- Notch izquierdo (r=20, diam=40px) -->
          <div style="
            position: absolute;
            top: 50%;
            left: -20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #F0E9DB;
            transform: translateY(-50%);
          "></div>

          <!-- Notch derecho -->
          <div style="
            position: absolute;
            top: 50%;
            right: -20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #F0E9DB;
            transform: translateY(-50%);
          "></div>

        </div>
      </div>

    </div><!-- fin #frame -->
  </div>

  <script>
    function scaleFrame() {
      var s = (window.innerWidth - 28) / 1080;
      var f = document.getElementById('frame');
      var sc = document.getElementById('scaler');
      f.style.transform = 'scale(' + s + ')';
      sc.style.height = Math.ceil(1920 * s) + 'px';
    }
    scaleFrame();
    window.addEventListener('resize', scaleFrame);
  </script>

</body>
</html>
